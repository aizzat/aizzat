<svg xmlns="http://www.w3.org/2000/svg" width="900" height="146" viewBox="0 0 900 146" role="img"><title>Unlocked: Veteran, Four Digits, Big Season, Builder</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.fade{animation:fade .7s ease-out backwards}
.growx{transform-box:fill-box;transform-origin:left;animation:growx 1.6s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:bottom;animation:growy 1.2s cubic-bezier(.2,.7,.2,1) backwards}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="145" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="24" y="34" fill="#1f2328" font-size="17" font-weight="700">ACHIEVEMENTS UNLOCKED</text><text x="876" y="34" fill="#59636e" font-size="11" text-anchor="end">page badges based on GitHub data</text><g class="fade" style="animation-delay:0.10s"><rect x="24" y="52" width="201" height="70" rx="10" fill="#f6f8fa" stroke="#8a5a00"/><text x="38" y="80" fill="#8a5a00" font-size="13" font-weight="700">★ Veteran</text><text x="38" y="104" fill="#1f2328" font-size="11" >10+ years on GitHub</text></g><g class="fade" style="animation-delay:0.25s"><rect x="241" y="52" width="201" height="70" rx="10" fill="#f6f8fa" stroke="#8a5a00"/><text x="255" y="80" fill="#8a5a00" font-size="13" font-weight="700">★ Four Digits</text><text x="255" y="104" fill="#1f2328" font-size="11" >1,000 all-time XP</text></g><g class="fade" style="animation-delay:0.40s"><rect x="458" y="52" width="201" height="70" rx="10" fill="#f6f8fa" stroke="#8a5a00"/><text x="472" y="80" fill="#8a5a00" font-size="13" font-weight="700">★ Big Season</text><text x="472" y="104" fill="#1f2328" font-size="11" >500 XP in one year</text></g><g class="fade" style="animation-delay:0.55s"><rect x="675" y="52" width="201" height="70" rx="10" fill="#f6f8fa" stroke="#8a5a00"/><text x="689" y="80" fill="#8a5a00" font-size="13" font-weight="700">★ Builder</text><text x="689" y="104" fill="#1f2328" font-size="11" >20 non-fork public repos</text></g></svg>
