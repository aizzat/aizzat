<svg xmlns="http://www.w3.org/2000/svg" width="900" height="178" viewBox="0 0 900 178" role="img"><title>Skill loadout: autonomy, robotics, teaching, software.</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.fade{animation:fade .7s ease-out backwards}
.growx{transform-box:fill-box;transform-origin:left;animation:growx 1.6s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:bottom;animation:growy 1.2s cubic-bezier(.2,.7,.2,1) backwards}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="177" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="24" y="34" fill="#1f2328" font-size="17" font-weight="700">SKILL LOADOUT</text><text x="876" y="34" fill="#59636e" font-size="12" text-anchor="end">areas of work, not ratings</text><g class="fade" style="animation-delay:0.15s"><rect x="24" y="52" width="201" height="106" rx="10" fill="#f6f8fa" stroke="#0f766e"/><text x="38" y="78" fill="#0f766e" font-size="13" font-weight="700">AUTONOMY</text><text x="38" y="108" fill="#1f2328" font-size="12" >Autonomous vehicles</text><text x="38" y="132" fill="#1f2328" font-size="12" >Physical AI</text><circle class="pulse" cx="209" cy="142" r="4" fill="#0f766e" style="animation-delay:0.00s"/></g><g class="fade" style="animation-delay:0.35s"><rect x="241" y="52" width="201" height="106" rx="10" fill="#f6f8fa" stroke="#0369a1"/><text x="255" y="78" fill="#0369a1" font-size="13" font-weight="700">ROBOTICS</text><text x="255" y="108" fill="#1f2328" font-size="12" >Robot software</text><text x="255" y="132" fill="#1f2328" font-size="12" >Robot modelling</text><circle class="pulse" cx="426" cy="142" r="4" fill="#0369a1" style="animation-delay:0.40s"/></g><g class="fade" style="animation-delay:0.55s"><rect x="458" y="52" width="201" height="106" rx="10" fill="#f6f8fa" stroke="#8a5a00"/><text x="472" y="78" fill="#8a5a00" font-size="13" font-weight="700">TEACHING</text><text x="472" y="108" fill="#1f2328" font-size="12" >Tutorials</text><text x="472" y="132" fill="#1f2328" font-size="12" >Workshop examples</text><circle class="pulse" cx="643" cy="142" r="4" fill="#8a5a00" style="animation-delay:0.80s"/></g><g class="fade" style="animation-delay:0.75s"><rect x="675" y="52" width="201" height="106" rx="10" fill="#f6f8fa" stroke="#0f766e"/><text x="689" y="78" fill="#0f766e" font-size="13" font-weight="700">SOFTWARE</text><text x="689" y="108" fill="#1f2328" font-size="12" >Mobile apps</text><text x="689" y="132" fill="#1f2328" font-size="12" >Web apps</text><circle class="pulse" cx="860" cy="142" r="4" fill="#0f766e" style="animation-delay:1.20s"/></g></svg>
