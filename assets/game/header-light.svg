<svg xmlns="http://www.w3.org/2000/svg" width="900" height="224" viewBox="0 0 900 224" role="img"><title>Dr. Muhammad Aizzat Zakaria, autonomous vehicle researcher. A small robot drives across the banner.</title><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.fade{animation:fade .7s ease-out backwards}
.growx{transform-box:fill-box;transform-origin:left;animation:growx 1.6s cubic-bezier(.2,.7,.2,1) backwards}
.growy{transform-box:fill-box;transform-origin:bottom;animation:growy 1.2s cubic-bezier(.2,.7,.2,1) backwards}
.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes pulse{50%{opacity:.35}}
.line{opacity:0;animation:cycle 16s infinite}@keyframes cycle{0%{opacity:0}3%,22.0%{opacity:1}25.0%,100%{opacity:0}}.road{animation:road 1s linear infinite}@keyframes road{to{stroke-dashoffset:-40}}.bot{animation:drive 14s linear infinite}@keyframes drive{from{transform:translateX(-90px)}to{transform:translateX(990px)}}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}@keyframes ping{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}@media (prefers-reduced-motion:reduce){.line:first-of-type{opacity:1}.bot{transform:translateX(760px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="223" rx="12" fill="#ffffff" stroke="#d1d9e0"/><text x="450" y="62" fill="#1f2328" font-size="34" text-anchor="middle" font-weight="700">Dr. Muhammad Aizzat Zakaria</text><text x="450" y="92" fill="#59636e" font-size="15" text-anchor="middle">Autonomous Vehicle Researcher · Associate Professor · Malaysia</text><g><text x="450" y="128" fill="#0369a1" font-size="17" text-anchor="middle" class="line" style="animation-delay:0.00s">&gt; Director, Centre for Innovation &amp; Tech Transfer @ UMPSA</text><text x="450" y="128" fill="#0369a1" font-size="17" text-anchor="middle" class="line" style="animation-delay:4.00s">&gt; Autonomous Vehicles · Robotics · Physical AI</text><text x="450" y="128" fill="#0369a1" font-size="17" text-anchor="middle" class="line" style="animation-delay:8.00s">&gt; Teaching robotics with open example code</text><text x="450" y="128" fill="#0369a1" font-size="17" text-anchor="middle" class="line" style="animation-delay:12.00s">&gt; RM 2.0M+ Research Grants · 100+ Publications · Ex-Intel R&amp;D</text></g><path d="M20 196H880" stroke="#d1d9e0" stroke-width="2"/><path class="road" d="M20 208H880" stroke="#59636e" stroke-width="2" stroke-dasharray="20 20"/><svg x="1" y="130" width="898" height="80" viewBox="0 0 898 80" overflow="hidden"><g class="bot"><circle class="ping" cx="30" cy="26" r="26" fill="none" stroke="#0f766e" style="animation-delay:0.00s"/><circle class="ping" cx="30" cy="26" r="26" fill="none" stroke="#0f766e" style="animation-delay:0.66s"/><circle class="ping" cx="30" cy="26" r="26" fill="none" stroke="#0f766e" style="animation-delay:1.32s"/><rect x="4" y="34" width="56" height="22" rx="6" fill="#0f766e"/><rect x="22" y="22" width="16" height="12" rx="3" fill="#0369a1"/><circle class="pulse" cx="52" cy="45" r="4" fill="#ffffff"/><circle cx="16" cy="59" r="8" fill="#1f2328"/><circle cx="16" cy="59" r="3" fill="#ffffff"/><circle cx="48" cy="59" r="8" fill="#1f2328"/><circle cx="48" cy="59" r="3" fill="#ffffff"/></g></svg></svg>
